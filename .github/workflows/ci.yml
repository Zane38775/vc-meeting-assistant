name: CI and Mac build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: node -e "if (process.arch !== 'arm64') throw new Error('Mac verification requires an Apple Silicon runner'); console.log(process.platform, process.arch, process.version)"

      - name: Install locked dependencies
        run: npm ci

      - name: Restore local speech model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/local-asr
          key: local-asr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/download-model.mjs') }}

      # Always run the downloader: a cache hit must still pass its pinned hashes.
      # Only the ~219 MiB runtime subsets and public WAV samples are cached.
      - name: Download or verify local speech model
        run: npm run model:download

      - name: Run tests with real-time local ASR samples
        env:
          RUN_LOCAL_ASR_REALTIME: '1'
        run: npm test

      - name: Type-check and build production assets
        run: npm run build

      - name: Build Apple Silicon app
        if: runner.os == 'macOS'
        run: npm run package:mac

      - name: Archive and verify Mac package
        if: runner.os == 'macOS'
        run: python3 scripts/archive-mac.py

      # CI artifacts are development builds, not Developer ID signed/notarized releases.
      # Hardware permissions, actual meeting audio, and DeepSeek still need manual testing.
      - name: Upload Mac development package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mac-apple-silicon-${{ github.sha }}
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
